# Dependabot — dev_ops:standards/stabilite.md M5.2. Les actions seulement : le dépôt
# n'a pas de package.json. Les bibliothèques chargées par CDN (algoliasearch,
# instantsearch.js, versions épinglées dans network-search.js) se montent à la main.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
