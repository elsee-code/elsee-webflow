<!-- Bloc Embed « code-embed » de la section Localisation du modèle CMS praticiens.
     1. Couper les champs CMS (pastilles violettes) de la ligne `const adresseFallback = "…"` et les
        coller dans l'attribut data-adresse du div, dans le même ordre, avec les mêmes virgules.
     2. Remplacer le <script> qui suit le div par la balise fiche-carte.js.
     3. Garder la balise Google Maps, en retirant « async » (il reste « defer »). -->

<div id="map" data-adresse="{{adresse}}, {{code postal}},{{ville}} " style="width: 100%; height: 400px; border-radius: 12px; overflow: hidden; position: relative;"></div>

<script src="{{jsdelivr:fiche-carte.js}}" integrity="{{sri:fiche-carte.js}}" crossorigin="anonymous" defer></script>

<!-- Chargement de l'API Google Maps : la balise actuelle, avec sa clé (la clé n'est pas dans le dépôt), SANS « async » -->
<script defer src="https://maps.googleapis.com/maps/api/js?key=CLE_GOOGLE_MAPS&callback=initMap&libraries=marker"></script>
