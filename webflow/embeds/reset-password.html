<style>
.reset-password-form {
  width: 100%;
  max-width: 400px;
  background: #ffffff;
  border: 1px solid #E9EDBE;
  border-radius: 20px;
  padding: 40px 36px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  box-shadow: 0 4px 24px rgba(30, 70, 52, 0.05);
  box-sizing: border-box;
}
.reset-password-title {
  font-size: 20px;
  font-weight: 700;
  color: #173B2B;
  text-align: center;
  margin-bottom: 8px;
}
.reset-password-fields-wrapper {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.reset-password-form-label {
  font-size: 14px;
  font-weight: 600;
  color: #173B2B;
}
.reset-password-field {
  min-height: 48px;
  margin-bottom: 0px;
  border: 1px solid #EDEAE0;
  border-radius: 100px;
  background-color: #F6F4EC;
  padding: 6px 18px;
  font-size: 15px;
  color: #173B2B;
  box-sizing: border-box;
  transition: border-color .15s, background .15s;
}
.reset-password-field:focus {
  outline: none;
  border-color: #EBD98A;
  background: #ffffff;
}
.reset-passwrod-form-submit.w-button {
  margin-top: 8px;
  min-height: 48px;
  border: none;
  border-radius: 100px;
  background-color: #EFD273;
  color: #173B2B;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
}
.reset-passwrod-form-submit.w-button:hover {
  background-color: #E8C75A;
}
#reset-status {
  font-size: 13px;
  color: #173B2B;
  text-align: center;
  min-height: 16px;
}
</style>

<form id="reset-form" class="reset-password-form">
  <div class="reset-password-title">Réinitialiser votre mot de passe</div>

  <div class="reset-password-fields-wrapper">
    <label for="new-password" class="reset-password-form-label">Nouveau mot de passe</label>
    <div style="position:relative;">
      <input class="reset-password-field" type="password" id="new-password" autocomplete="new-password" required style="width:100%; padding-right:48px;">
      <button type="button" class="pw-toggle" data-target="new-password" aria-label="Afficher le mot de passe" style="position:absolute; right:16px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; padding:4px; font-size:16px; color:#173B2B;"><i class="fa-solid fa-eye"></i></button>
    </div>
  </div>

  <div class="reset-password-fields-wrapper">
    <label for="confirm-password" class="reset-password-form-label">Confirmer mot de passe</label>
    <div style="position:relative;">
      <input class="reset-password-field" type="password" id="confirm-password" autocomplete="new-password" required style="width:100%; padding-right:48px;">
      <button type="button" class="pw-toggle" data-target="confirm-password" aria-label="Afficher le mot de passe" style="position:absolute; right:16px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; padding:4px; font-size:16px; color:#173B2B;"><i class="fa-solid fa-eye"></i></button>
    </div>
  </div>

  <button type="submit" class="reset-passwrod-form-submit w-button">
    Réinitialiser mon mot de passe
  </button>

  <div id="reset-status" style="margin-top:12px;"></div>
</form>
